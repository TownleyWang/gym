<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('预约详情')" />
</head>
<body class="gray-bg">
<div class="container-div">
    <h2>预约详情</h2>
    <div class="form-horizontal">
        <div class="form-group">
            <label class="col-sm-2 control-label">预约项目：</label>
            <div class="col-sm-10">
                <p class="form-control-static" th:text="${resourceName}"></p>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">预约时间：</label>
            <div class="col-sm-10">
                <p class="form-control-static" th:text="${slotTime}"></p>
            </div>
        </div>
    </div>
</div>
<th:block th:include="include :: footer" />
</body>
</html>
