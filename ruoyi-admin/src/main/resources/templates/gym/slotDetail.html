<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:include="include :: header('预约详情')" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body class="gray-bg">
<div class="container-div">
    <h2>预约详情</h2>
    <div class="form-horizontal">
        <div class="form-group">
            <label class="col-sm-2 control-label">预约项目：</label>
            <div class="col-sm-10">
                <p class="form-control-static" th:text="${resourceName}"></p>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label">预约时间：</label>
            <div class="col-sm-10">
                <p class="form-control-static" th:text="${slotTime}"></p>
            </div>
        </div>

        <!-- AI 建议 -->
        <div class="form-group">
            <label class="col-sm-2 control-label">AI 健身建议：</label>
            <div class="col-sm-10">

                <div class="form-control-static" id="aiMarkdownBox"></div>
                <script th:inline="javascript">
                    const rawMarkdown = /*[[${aiSuggestion}]]*/ '';
                    document.getElementById("aiMarkdownBox").innerHTML = marked.parse(rawMarkdown);
                </script>

            </div>
        </div>

    </div>
</div>
<th:block th:include="include :: footer" />
</body>
</html>
